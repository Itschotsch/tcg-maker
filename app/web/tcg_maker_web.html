<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCG Maker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css">
</head>

<body>
    <div class="container">
        <section class="section">
            <h1 class="title">TCG Maker</h1>
            <form action="/api/create" method="post" enctype="multipart/form-data">
                <div class="field">
                    <input type="radio" name="csv_selection" id="fetch_remote_csv" value="fetch"
                        onclick="document.getElementById('csv_file').disabled = true">
                    <label class="radio" for="fetch_remote_csv">Fetch the CSV from source</label>
                    <input type="radio" name="csv_selection" id="provided_local_csv" value="provided" checked
                        onclick="document.getElementById('csv_file').disabled = false">
                    <label class="radio" for="provided_local_csv">Use the following CSV</label>
                </div>
                <div class="field">
                    <label class="label" for="csv_file">CSV File:</label>
                    <div class="control">
                        <input class="input" type="file" name="csv_file" id="csv_file">
                    </div>
                </div>
                <div class="field">
                    <input type="checkbox" name="preprocess_csv" id="preprocess_csv" checked>
                    <label class="checkbox" for="preprocess_csv">Pre-process CSV file (necessary if not in the correct
                        format)</label>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_html" id="render_html" checked>
                    <label class="checkbox" for="render_html">Render HTML files (necessary if any card data
                        changed)</label>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_png" id="render_png" checked>
                    <label class="checkbox" for="render_png">Render card PNG images (necessary if any card data
                        changed)</label>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_special" id="render_special" checked>
                    <label class="checkbox" for="render_special">Render special cards (necessary if the hidden card or
                        the card back changed)</label>
                </div>
                <div class="field">
                    <input type="radio" name="render_selection" id="render_all" value="all"
                        onclick="document.getElementById('card_ids').disabled = true">
                    <label class="radio" for="render_all">Render all cards</label>
                    <input type="radio" name="render_selection" id="render_ids" value="ids" checked
                        onclick="document.getElementById('card_ids').disabled = false">
                    <label class="radio" for="render_ids">Only render cards with the following IDs</label>
                </div>
                <div class="field">
                    <label class="label" for="card_ids">Card IDs:</label>
                    <div class="control">
                        <input class="input" type="text" name="card_ids" id="card_ids" value="1,2,3">
                    </div>
                </div>
                <div class="field">
                    <label class="label" for="release_label">Release Label:</label>
                    <div class="control">
                        <input class="input" type="text" name="release_label" id="release_label" value="α">
                    </div>
                </div>
                <div class="field">
                    <label class="label" for="backside_filename">Backside Filename:</label>
                    <div class="control">
                        <input class="input" type="text" name="backside_filename" id="backside_filename"
                            value="cardback.png">
                    </div>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_jpg" id="render_jpg" checked>
                    <label class="checkbox" for="render_jpg">Render JPG for <a
                            href="https://tcg-arena.fr/">TCG-Arena</a></label>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_pdf_singles" id="render_pdf_singles">
                    <label class="checkbox" for="render_pdf_singles">Render PDF singles for printing</label>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_pdf_singles_cardbacks" id="render_pdf_singles_cardbacks">
                    <label class="checkbox" for="render_pdf_singles_cardbacks">Render PDF singles cardbacks for
                        printing</label>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_pdf" id="render_pdf">
                    <label class="checkbox" for="render_pdf">Render PDF for printing</label>
                </div>
                <div class="field">
                    <input type="checkbox" name="render_tts" id="render_tts">
                    <label class="checkbox" for="render_tts">Render PNG for TTS</label>
                </div>
                <div class="field">
                    <div class="control">
                        <button class="button is-primary" type="submit">Run</button>
                    </div>
                </div>
            </form>
        </section>
    </div>
</body>

</html>
