.card {
    position: relative;

.safe-area {
    position: relative;
    display: inherit;
    flex-direction: inherit;
    justify-content: inherit;
    align-items: inherit;
    width: inherit;
    height: inherit;
    max-width: calc(100vw - 2 * 4vw);
    max-width: calc(100vw - 2 * 35px);
    margin-left: 4vw;
    margin-left: 35px;
    margin-right: 4vw;
    margin-right: 35px;
}

.safe-area.top {
    padding-top: 4vw;
    padding-top: 35px;
}

.safe-area.bottom {
    /* padding-bottom: 4vw;
    padding-bottom: 35px; */
    margin-left: calc(35px + 10.5vw);
    margin-right: calc(35px + 10.5vw);
    margin-bottom: calc(35px + 2vw);
}

.safe-area-preview {
    /* Only for development: */
    display: none;
    position: absolute;
    top: 4vw;
    top: 35px;
    left: 4vw;
    left: 35px;
    width: calc(100% - 8vw);
    width: calc(100% - 35px * 2);
    height: calc(100% - 8vw);
    height: calc(100% - 35px * 2);

    z-index: 10;

    border-radius: 3vw;
    border-radius: 35px;

    /* shadow, expand 100px in all directions without falloff */
    box-shadow: 0 0 0 calc(2*4vw) rgba(128, 128, 128, 0.666);
    box-shadow: 0 0 0 calc(2*35px) rgba(128, 128, 128, 0.666);

    pointer-events: none;

    <script type="text/javascript">
        // Remove all .cost elements whose .cost-amount is non-numeric or 0
        let costAmounts = document.getElementsByClassName("cost-amount");
        Array.from(costAmounts).forEach(function (costAmount) {
            if (!/^[0-9]+$/.test(costAmount.textContent.trim()) || costAmount.textContent.trim() == 0) {
                costAmount.parentElement.remove();
            }
        });
    </script>
