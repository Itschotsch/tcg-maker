<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <!-- A card measures 63mm x 88mm -->
    <meta name="viewport" content="width=§Width§, height=§Height§, initial-scale=1.0">
    <title>§Title§</title>

    <link rel="stylesheet" href="../../input/html/style.css">
    <style>
        §Style§
    </style>
</head>

<body>
    <div class="card layout-§Layout§">
        <div class="safe-area-preview"></div>
        <div class="safe-area top">
            <div class="titles">
                <div class="title">§Title§</div>
                <div class="subtitle">§Subtitle§</div>
            </div>
            <div class="cost-list">
                <div class="cost">
                    <div class="cost-element terra"></div>
                    <div class="cost-amount">
                        <p>§CostTerra§</p>
                    </div>
                </div>
                <div class="cost">
                    <div class="cost-element aqua"></div>
                    <div class="cost-amount">
                        <p>§CostAqua§</p>
                    </div>
                </div>
                <div class="cost">
                    <div class="cost-element aeris"></div>
                    <div class="cost-amount">
                        <p>§CostAeris§</p>
                    </div>
                </div>
                <div class="cost">
                    <div class="cost-element ignis"></div>
                    <div class="cost-amount">
                        <p>§CostIgnis§</p>
                    </div>
                </div>
                <div class="cost">
                    <div class="cost-element magica"></div>
                    <div class="cost-amount">
                        <p>§CostMagica§</p>
                    </div>
                </div>
                <div class="cost">
                    <div class="cost-element unshaped"></div>
                    <div class="cost-amount">
                        <p>§CostUnshaped§</p>
                    </div>
                </div>
            </div>
            <div class="faction"></div>
        </div>
        <div class="spacer"></div>
        <div class="safe-area">
            <div class="parchment">
                <div class="card-kind">
                    <div>§EntityKind§</div>
                </div>
                <div class="entity-type">§EntityType§</div>
                <div class="description">§Description§</div>
                <div class="flavour-text">§FlavourText§</div>
                <div class="combat-stats">
                    <div class="offensive"><img src="../../input/layout/combat_stats_offensive_symbol.png"
                            class="combat-stats-symbol" />&nbsp;§OffensiveStat§</div>
                    <div class="defensive"><img src="../../input/layout/combat_stats_defensive_symbol.png"
                            class="combat-stats-symbol" />&nbsp;§DefensiveStat§</div>
                    <div class="elemental §Elemental§">
                        <p>§ElementalAmount§</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="safe-area bottom">
                <div class="id">§ReleaseLabelDisplay§–§ID§</div>
                <!--<div class="author" style="height: 0.7em">
                    <img src="../../input/layout/AetherlabLogo.png" style="height: 100%; bottom: -0.005em; position: relative;" />
                </div>-->
                <div class="spacer"></div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        // Remove all .cost elements whose .cost-amount is non-numeric or 0
        let costAmounts = document.getElementsByClassName("cost-amount");
        Array.from(costAmounts).forEach(function (costAmount) {
            if (!/^[0-9XxYyZz\+\-]+$/.test(costAmount.textContent.trim()) || costAmount.textContent.trim() == 0) {
                costAmount.parentElement.remove();
            }
        });
    </script>
</body>

</html>
